services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - film-network

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    # ports: Порты убирал трафик пойдет через внутреннюю сеть Docker от Nginx
    #   - "8080:80"
    networks:
      - film-network
    depends_on:
      - database

  backend:
    build: ./backend
    image: ghcr.io/${GITHUB_OWNER}/film-react-nest-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: database
    depends_on:
      - database
    networks:
      - film-network

  frontend:
    build: ./frontend
    image: ghcr.io/${GITHUB_OWNER}/film-react-nest-frontend:latest
    restart: unless-stopped
    volumes:
      - frontend-dist:/usr/share/nginx/html
    networks:
      - film-network

  nginx:
    build: ./nginx
    image: ghcr.io/${GITHUB_OWNER}/film-react-nest-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - film-network

networks:
  film-network:

volumes:
  db-data:
  pgadmin-data:
  frontend-dist: